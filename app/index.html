<title>IMM Raumplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfzeile · Inventar links · Zeichenblatt 2D und/oder 3D · Statuszeile. Farben angelehnt an Planpapier und ZHAW-Blau. */
:root{
  --paper:#eef1f3; --sheet:#fbfcfc; --panel:#ffffff; --ink:#1c2227; --muted:#5b6670; --line:#d3d9de;
  --accent:#0064a6; --accent-weak:#e0edf6; --warn:#c0392b; --warn-weak:#fbe4e1; --ok:#2b7a4b;
  --wall:#262c31; --floor:#fbfcfc; --glass:#cfe3ef; --grid-minor:#e6eaed; --grid-major:#d2d9de;
  --swing:rgba(0,100,166,.08); --dim:#6d7882; --halo:#fbfcfc;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161a; --sheet:#181d21; --panel:#1d2328; --ink:#e4e9ed; --muted:#97a3ad; --line:#2f373e;
  --accent:#55a7dd; --accent-weak:#1b3446; --warn:#ef6b5b; --warn-weak:#3a1f1c; --ok:#5cc28a;
  --wall:#cfd6dc; --floor:#181d21; --glass:#2a4757; --grid-minor:#20262b; --grid-major:#2b3238;
  --swing:rgba(85,167,221,.10); --dim:#8b97a1; --halo:#181d21; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161a; --sheet:#181d21; --panel:#1d2328; --ink:#e4e9ed; --muted:#97a3ad; --line:#2f373e;
  --accent:#55a7dd; --accent-weak:#1b3446; --warn:#ef6b5b; --warn-weak:#3a1f1c; --ok:#5cc28a;
  --wall:#cfd6dc; --floor:#181d21; --glass:#2a4757; --grid-minor:#20262b; --grid-major:#2b3238;
  --swing:rgba(85,167,221,.10); --dim:#8b97a1; --halo:#181d21; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:14px;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopfzeile */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px;min-width:0}
.brand b{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.grow{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:34px;box-sizing:border-box}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.icon{padding:6px 8px;min-width:34px;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 10px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
select.var{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px;max-width:220px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;z-index:40;min-width:220px;display:flex;flex-direction:column}
.menu-pop button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:5px}
.menu-pop button:hover{background:var(--accent-weak)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Hauptbereich */
main{display:grid;grid-template-columns:268px 1fr;gap:8px;min-height:0;min-width:0}
aside#cat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cat-head{padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.cat-head h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;display:flex;justify-content:space-between}
.cat-head input{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.cat-list{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px;touch-action:pan-y;flex:1}
.card{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center;padding:6px;border-radius:6px;border:1px solid transparent;user-select:none;-webkit-user-select:none;cursor:grab}
.card:hover{background:var(--accent-weak)}
.thumb{width:52px;height:52px;border-radius:5px;background:var(--sheet);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.card .nm{font-weight:500;font-size:13.5px;line-height:1.2}
.card .ms{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.card .ct{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.card .ct.over{color:var(--warn);font-weight:500}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.cat-foot{padding:8px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.4}

#work{display:grid;gap:8px;min-height:0;min-width:0}
#work[data-layout="2d"]{grid-template-columns:1fr}
#work[data-layout="3d"]{grid-template-columns:1fr}
#work[data-layout="split"]{grid-template-columns:1fr 1fr}
@media (orientation:portrait){#work[data-layout="split"]{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
#work[data-layout="2d"] #pane3d,#work[data-layout="3d"] #pane2d{display:none}
.pane{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:0;min-width:0}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:absolute;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.float.tl{top:8px;left:8px;right:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;min-height:30px;box-sizing:border-box}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
#hint3d{right:auto;left:10px;max-width:calc(100% - 190px)}
.pane-label{position:absolute;right:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none;z-index:4}

/* Varianten-Info und Galerie */
#vinfo{position:absolute;top:50px;left:8px;max-width:min(460px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:12.5px;z-index:5;cursor:pointer;line-height:1.4}
#vinfo .why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);margin-top:2px}
#vinfo.open .why{display:block}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vcard.cur{border-color:var(--accent);background:var(--accent-weak)}
.vprev{padding:0;border:0;background:none;display:block;width:100%}
.vprev svg{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--line);border-radius:5px}
.vcard input{background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;box-sizing:border-box}
.vcard input[data-f="name"]{font-weight:500}
.vmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.vnums{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vwhy{margin:0;font-size:12.5px;line-height:1.45}
.vcard .acts{display:flex;gap:6px;align-items:center}
.meta{font-size:12px;color:var(--muted)}

/* Inspektor */
#insp{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 6px 18px rgba(0,0,0,.10);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;z-index:6}
#insp .ttl{display:flex;flex-direction:column;min-width:0;margin-right:4px}
#insp .ttl b{font-weight:600;font-size:13.5px}
#insp .ttl span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
#insp label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
#insp input{width:62px;background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:12.5px}
#insp .sep{width:1px;align-self:stretch;background:var(--line)}
.state{font-size:12px;padding:2px 8px;border-radius:999px}
.state.bad{background:var(--warn-weak);color:var(--warn);font-weight:500}
.state.good{color:var(--ok)}

/* 3D */
#walkpad{position:absolute;right:10px;bottom:28px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px;z-index:6}
#walkpad button{background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:18px;touch-action:none}
#msg3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}

/* Statuszeile */
footer{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;min-width:0}
footer b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
footer .bad b{color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:5px}
.dot.on{background:var(--ok)}

/* Dialoge */
.ovl{position:fixed;inset:0;background:rgba(10,14,18,.42);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 48px rgba(0,0,0,.25);width:min(760px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(1180px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:15px;font-weight:600;flex:1}
.dlg-b{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:7px}
.vrow.cur{border-color:var(--accent);background:var(--accent-weak)}
.vrow .nm{font-weight:500}
.vrow .meta{font-size:12px;color:var(--muted)}
.vrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vrow input{background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;box-sizing:border-box}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.cmp-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp-col svg{width:100%;height:auto;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
table.cnt{border-collapse:collapse;width:100%;font-size:12.5px}
table.cnt th,table.cnt td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
table.cnt td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
table.cnt td.diff{color:var(--accent);font-weight:500}
textarea.json{width:100%;min-height:260px;font-family:var(--f-mono);font-size:12px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;box-sizing:border-box}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:7px;font-size:13px;z-index:80;max-width:calc(100% - 40px)}
.ghost{position:fixed;pointer-events:none;z-index:90;background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:5px 8px;font-size:12.5px;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:translate(-50%,-120%)}

/* SVG-Klassen (Editor; Export setzt eigene Farben) */

.plan .zone{fill:var(--floor)}

.plan .gmi{stroke:var(--grid-minor)} 
.plan .gma{stroke:var(--grid-major)}

.plan .wall{fill:var(--wall)}

.plan .col{fill:var(--wall)}

.plan .win{fill:var(--glass);stroke:var(--wall)}

.plan .winl{stroke:var(--wall)}

.plan .leaf{stroke:var(--ink)} 
.plan .arc{stroke:var(--muted);fill:none}

.plan .swing{fill:var(--swing)}

.plan .ib{stroke:var(--ink)} 
.plan .ig{stroke:var(--ink);fill:none;opacity:.55}

.plan .ish{fill:rgba(0,0,0,.28)}

.plan .selbox{stroke:var(--accent);fill:none}

.plan .hitbox{stroke:var(--warn);fill:rgba(192,57,43,.12)}

.plan .handle{fill:var(--panel);stroke:var(--accent)} 
.plan .hline{stroke:var(--accent)}

.plan .lbl{fill:var(--ink);stroke:var(--halo);paint-order:stroke;font-family:var(--f-sans)}

.plan .zlbl{fill:var(--muted);font-family:var(--f-sans);letter-spacing:.08em;text-transform:uppercase}

.plan .dim{stroke:var(--dim)} 
.plan .dimt{fill:var(--dim);stroke:var(--halo);paint-order:stroke;font-family:var(--f-mono)}

.plan .seldim{stroke:var(--accent)} 
.plan .seldimt{fill:var(--accent);stroke:var(--halo);paint-order:stroke;font-family:var(--f-mono);font-weight:500}
.plan [data-act="item"]{cursor:move} .plan [data-act="rot"]{cursor:grab}

@media (max-width:820px){
  main{grid-template-columns:1fr}
  aside#cat{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:70px;bottom:50px;width:min(300px,calc(100% - 32px));z-index:30;box-shadow:0 12px 32px rgba(0,0,0,.22)}
  aside#cat.closed{display:none}
  .brand span{display:none}
}
@media (min-width:821px){#btnCat{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header>
    <button class="btn icon" id="btnCat" aria-label="Inventar ein- oder ausblenden">☰</button>
    <div class="brand"><b>IMM Raumplaner</b><span id="roomName">Institut für Marketing Management · ZHAW</span></div>
    <button class="btn icon" id="btnPrev" title="Vorherige Variante ( [ )" aria-label="Vorherige Variante">◀</button><select class="var" id="selVar" aria-label="Variante wählen"></select><button class="btn icon" id="btnNext" title="Nächste Variante ( ] )" aria-label="Nächste Variante">▶</button>
    <button class="btn" id="btnVars">Varianten</button>
    <div class="grow"></div>
    <button class="btn icon" id="btnUndo" title="Rückgängig (Ctrl+Z)" aria-label="Rückgängig">↶</button>
    <button class="btn icon" id="btnRedo" title="Wiederholen (Ctrl+Shift+Z)" aria-label="Wiederholen">↷</button>
    <div class="seg" role="group" aria-label="Ansicht">
      <button data-layout="2d">2D</button><button data-layout="split">2D + 3D</button><button data-layout="3d">3D</button>
    </div>
    <div class="menu">
      <button class="btn" id="btnExport" aria-haspopup="true">Export</button>
      <div class="menu-pop" id="popExport" hidden>
        <button data-x="png">Plan als PNG</button>
        <button data-x="pdf">Plan als PDF (A4 quer, massstäblich)</button>
        <hr>
        <button data-x="json">Variante als JSON</button>
        <button data-x="jsonall">Alle Varianten als JSON</button>
        <button data-x="import">JSON importieren …</button>
      </div>
    </div>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </header>

  <main>
    <aside id="cat">
      <div class="cat-head">
        <h2><span>Inventar</span><span id="catCount"></span></h2>
        <input id="catSearch" type="search" placeholder="Suchen: Tisch, Stuhl, Regal …" aria-label="Inventar durchsuchen">
      </div>
      <div class="cat-list" id="catList"></div>
      <div class="cat-foot">Antippen setzt das Stück in die Planmitte. Seitlich in den Plan ziehen setzt es an die Stelle.</div>
    </aside>

    <section id="work" data-layout="split">
      <div class="pane" id="pane2d">
        <svg id="plan" class="plan" xmlns="http://www.w3.org/2000/svg" aria-label="Grundriss 2D"></svg>
        <div class="float tl">
          <button class="chip" data-opt="grid">Raster</button>
          <button class="chip" data-opt="dims">Masse</button>
          <button class="chip" data-opt="swing">Türschwenk</button>
          <button class="chip" data-opt="labels">Namen</button>
          <button class="chip" data-opt="snap">Einrasten</button>
          <button class="chip" id="btnFit">Einpassen</button>
        </div>
        <div id="vinfo" hidden title="Antippen: ganze Begründung"></div>
        <div id="insp" hidden></div>
        <div class="pane-label" id="scaleLbl"></div>
      </div>
      <div class="pane" id="pane3d">
        <canvas id="c3d"></canvas>
        <div id="msg3d">3D-Ansicht wird geladen …</div>
        <div class="float tl" id="views3d"></div>
        <div id="walkpad" hidden>
          <span></span><button data-walk="f" aria-label="Vorwärts">▲</button><span></span>
          <button data-walk="l" aria-label="Links drehen">⟲</button><button data-walk="b" aria-label="Rückwärts">▼</button><button data-walk="r" aria-label="Rechts drehen">⟳</button>
        </div>
        <div class="pane-label" id="hint3d"></div>
      </div>
    </section>
  </main>

  <footer id="status"></footer>
</div>
<div id="toast" hidden></div>

</script>
<script type="module">
/* ============================================================
   IMM Raumplaner – 2D-Inventar-Editor mit 3D-Betrachter
   Daten: daten/raum.json (feste Geometrie), daten/katalog.json
   (Inventar), Varianten in der Artifact-Datenbank (Sammlung
   "varianten"), ersatzweise im Browser.
   Koordinaten: Meter, x rechts, y unten (Draufsicht), rot in Grad
   im Uhrzeigersinn. Lokale Stückachsen: b entlang x, t entlang y,
   Vorderseite +y.
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const G = (() => {
// IMM Raumplaner – gemeinsame Geometrie für Seite (wird beim Bau eingebettet) und Kommandozeile (node).
// Meter, x rechts, y unten; rot in Grad im Uhrzeigersinn; Stück lokal: b entlang x, t entlang y, Vorderseite +y.

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const cm = m => Math.round(m * 100);
const f3 = x => Math.round(x * 1000) / 1000;

/* ---------- Vektoren ---------- */
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const len = a => Math.hypot(a[0], a[1]);
const nrm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const perp = a => [-a[1], a[0]];
const rotv = (p, deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; };
function inPoly(pt, poly) {
  let ins = false;

async function connectStore(prefCur) {
  db = await use('db');
  if (!db) {
    S.store = 'local';
    let arr = null; try { arr = JSON.parse(localStorage.getItem('imm-varianten') || 'null'); } catch { }
    if (arr?.length) { for (const v of arr) S.variants[v.id] = v; }
    else if (S.beispiel) { const v = newVariant(S.beispiel.name, S.beispiel.platzierungen, S.beispiel.notiz); v.id = S.beispiel.id; S.variants = { [v.id]: v }; }
    finishConnect(prefCur); return;
  }
  let first = true;
  const timer = setTimeout(() => { if (first) { S.saveState = 'Speicher antwortet nicht'; renderStatus(); } }, 10000);
  db.collection(COL).onSnapshot(snap => {
    clearTimeout(timer);
    const seen = new Set();
    for (const d of snap.docs) {
      const data = d.data(); if (!data) continue; seen.add(d.id);
      const local = S.variants[d.id];
      if (!first && !local) toast(`Neue Variante: ${data.name || d.id}${data.autor ? ' · von ' + data.autor : ''}`);
      if (local && (local.dirty || (S.dragging && d.id === S.curId) || (local.updated || 0) >= (data.updated || 0))) continue;
      S.variants[d.id] = { ...structuredClone(data), id: d.id };
    }
    for (const id of Object.keys(S.variants)) if (!seen.has(id) && !S.variants[id].dirty && !S.variants[id].localOnly) delete S.variants[id];
    if (first) {
      first = false; S.store = 'db';
      for (const v of Object.values(S.variants)) if (v.dirty) { delete v.localOnly; persist(v); }
      finishConnect(prefCur);
    } else {
      if (!S.variants[S.curId]) S.curId = sorted()[0]?.id || newVariant('Variante A', []).id;
      renderVarSelect(); renderVinfo(); changed(false);
    }
  }, err => { clearTimeout(timer); S.store = 'local'; S.storeErr = err?.message || err?.code || ''; S.saveState = 'geteilter Speicher nicht erreichbar'; finishConnect(prefCur); });
}
function finishConnect(prefCur) {
  // Platzhalter-Arbeitsvariante wegräumen, wenn sie leer und ungenutzt ist

  if (!Object.keys(S.variants).length) newVariant('Variante A', []);
  const id = S.variants[prefCur] ? prefCur : S.variants[S.curId] ? S.curId : sorted()[0].id;
  if (S.store === 'local') for (const v of Object.values(S.variants)) if (v.dirty) persist(v);
  switchTo(id); renderStatus();
}

function exportSVG(v) {
  const PW = 3508, PH = 2480, mm = PW / 297;
  const b = S.R.bounds, pad = 1.0, bw = b.x1 - b.x0 + 2 * pad, bh = b.y1 - b.y0 + 2 * pad;
  const areaW = 297 - 12 - 82 - 10, areaH = 210 - 24;
  const N = [20, 25, 50, 75, 100, 125, 150, 200, 250, 300, 400, 500, 750, 1000].find(n => bw * 1000 / n <= areaW && bh * 1000 / n <= areaH) || 1000;
  const k = 1000 / N * mm, u = 2.6 / k * 1.0;
  const ox = 12 * mm + (areaW * mm - bw * k) / 2 - (b.x0 - pad) * k, oy = 12 * mm + (areaH * mm - bh * k) / 2 - (b.y0 - pad) * k;
  computeHits();
  const plan = renderPlan(v, { u, k, interactive: false, opts: { grid: false, dims: true, swing: true, labels: true } });
  const cx = (297 - 12 - 82) * mm, T = (y, s, txt, cls = 't', w = 400) => `<text x="${cx}" y="${y * mm}" font-size="${s * mm}" font-weight="${w}" class="${cls}">${esc(txt)}</text>`;
  const counts = {}; for (const p of v.platzierungen) counts[p.stueck] = (counts[p.stueck] || 0) + 1;
  const rows = Object.entries(counts).sort((a, c) => piece(a[0]).name.localeCompare(piece(c[0]).name, 'de'));
  let y = 52, leg = '';
  for (const [id, n] of rows.slice(0, 26)) { const st = piece(id); leg += T(y, 3.1, `${n} × ${st.name}`) + T(y + 3.6, 2.5, `${cm(st.b)} × ${cm(st.t)} × ${cm(st.h)} cm${st.herkunft === 'geschaetzt' ? ' (geschätzt)' : ''}`, 'm'); y += 8.2; }
  if (rows.length > 26) leg += T(y, 2.8, `… und ${rows.length - 26} weitere`, 'm');
  const sb = [0, 1, 2, 3, 4, 5].map(i => `<rect x="${cx + i * 1000 / N * mm}" y="${(210 - 26) * mm}" width="${1000 / N * mm}" height="${1.6 * mm}" fill="${i % 2 ? '#ffffff' : '#22282d'}" stroke="#22282d" stroke-width="2"/>`).join('') +
    `<text x="${cx}" y="${(210 - 28) * mm}" font-size="${2.5 * mm}" class="m">0</text><text x="${cx + 5 * 1000 / N * mm}" y="${(210 - 28) * mm}" font-size="${2.5 * mm}" class="m" text-anchor="middle">5 m</text>`;
  const est = (S.raum.waende || []).every(w => w.herkunft === 'geschaetzt');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}"><style>${EXPORT_CSS}</style>
    <rect width="${PW}" height="${PH}" fill="#ffffff"/>
    <g transform="translate(${ox} ${oy}) scale(${k})">${plan}</g>
    <line x1="${cx - 6 * mm}" y1="${12 * mm}" x2="${cx - 6 * mm}" y2="${(210 - 12) * mm}" stroke="#d3d9de" stroke-width="3"/>
    ${T(18, 3, 'INSTITUT FÜR MARKETING MANAGEMENT · ZHAW', 'm')}
    ${T(27, 6.2, v.name, 't', 600)}
    ${T(33.5, 3.1, v.notiz || 'Möblierungsvariante')}
    ${T(41, 2.8, `${v.platzierungen.length} Stücke · ${S.hits.size} mit Überschneidung · Stand ${new Date().toLocaleDateString('de-CH')}`, 'm')}
    ${leg}

  catch (e) { $('#status').textContent = 'Raum- oder Inventardaten fehlen: ' + e.message; return; }
  try { S.beispiel = await getJSON('daten/beispiel.json'); } catch { }
  S.raum = raum; S.kat = kat; S.M = G.makeModel(raum, kat); S.byId = S.M.byId; S.R = S.M.R;
  $('#roomName').textContent = `Institut für Marketing Management · ZHAW · ${raum.name}`;
  const prefs = loadPrefs();
  if (prefs?.opts) Object.assign(S.opts, prefs.opts);
  renderOpts();
  // Arbeitsvariante, bis der Speicher antwortet
  const w = newVariant('Variante A', []); w.localOnly = true; S.curId = w.id;
  renderVarSelect(); computeHits(); renderCatalog(); renderStatus(); renderInspector();
  setLayout(prefs?.layout || (matchMedia('(max-width:820px)').matches ? '2d' : 'split'));
  connectStore(prefs?.cur);
}
start();
</script>
